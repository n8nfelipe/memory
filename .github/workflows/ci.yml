name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --extra dev --extra shared

      - name: Lint
        run: uv run ruff check .

      - name: Check types
        run: uv run mypy src/llm_memory

      - name: Run tests with coverage
        run: uv run pytest --cov=llm_memory --cov-report=term-missing --cov-report=xml

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit

      - name: Build Python distributions
        if: matrix.python-version == '3.13'
        run: uv build
